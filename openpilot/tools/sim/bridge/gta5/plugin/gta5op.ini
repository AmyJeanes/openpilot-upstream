; gta5op settings, read when the core loads (it reloads whenever gta5op_core.dll changes)
[gta5op]
; host:port of the bridge; empty reads C:\Users\Public\gta5op-bridge.txt, which the bridge writes on start
bridge=
; vertical field of view of the game camera, degrees; both openpilot cameras are resampled from it
vfov=76
; 1 = comma 3X lenses, 0 = openpilot's plain pinhole cameras
lens=1
; camera mount, meters: height above the ground, and forward of the vehicle origin (empty = a quarter of its half-length)
mount_height=1.22
mount_forward=
; steering: yaw rate (rad/s) per unit of the game's steer bias, and the integral gain (1/s) that corrects it
yaw_gain=15.5
lat_ki=1.0
; with no throttle the game slows a car by about coast_accel + coast_per_speed * speed (m/s^2); brake_gain is the m/s^2
; full brake adds, roughly
coast_accel=3.1
coast_per_speed=0.04
brake_gain=8
; virtual-key codes: engage/disengage (F6), left and right indicators (comma, period), cruise speed up and down (= and -)
key_engage=0x75
key_left=0xBC
key_right=0xBE
key_speed_up=0xBB
key_speed_down=0xBD
; 1 = render the openpilot camera only on the 20 Hz frames it captures, so the player's camera shows on the rest (best with
; anti-aliasing that blends frames - TAA, DLSS, FSR - and motion blur off); lag is game frames from switching to rendering
interleave=0
interleave_lag=0
; when interleaving, 1 = take the frames from the game's D3D12 presents and show the player's previous frame in their
; place, so they don't show; 0 = capture the window, where they flicker
present_hook=1

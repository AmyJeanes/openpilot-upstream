; gta5op settings, read when the core loads (it reloads whenever gta5op_core.dll changes)
[gta5op]
; host:port of the bridge; empty reads C:\Users\Public\gta5op-bridge.txt, which the bridge writes on start
bridge=
; vertical field of view of the game camera, degrees, when one render covers both openpilot cameras
vfov=76
; 1 = comma 3X lenses, 0 = openpilot's plain pinhole cameras
lens=1
; camera mount, meters: height above the ground, and forward of the vehicle origin, for cars without a windscreen bone
; (empty = a quarter of its half-length); a car with one is mounted just behind it, unless mount_forward is set
mount_height=1.22
mount_forward=
; steering: path curvature (1/m) per unit of the game's steer bias at low speed, to start from (it's learned per car while
; driving; the game's fall with speed is built in), and the integral gain (1/s) that corrects it
curv_gain=3.4
lat_ki=1.0
; with no throttle the game slows a car by about coast_accel + coast_per_speed * speed (m/s^2)
coast_accel=3.11
coast_per_speed=0.026
; the game takes up a pedal only from a quarter of its travel: under throttle_edge the throttle does nothing, at it
; it gives throttle_edge_drive m/s^2 over coasting (about what holds the speed); the brake gives brake_edge_gain beyond
; coasting at brake_edge and goes on from there as steeply as if a brake of 1.0 gave brake_gain (the Model 3: 57, all
; on by 0.4; a stock sedan: 23.5). What lies between nothing and an edge is given by pulsing the pedal at its edge,
; pedal_pulse frames a pulse (0 = no pulsing, the pedals as before). A lon message with the same keys sets these
; live; the map driver sends each car's.
throttle_edge=0.27
throttle_edge_drive=3.4
brake_edge=0.26
brake_edge_gain=0.75
brake_gain=57
pedal_pulse=1
; a stop is held with the handbrake once the car is this slow (m/s); backing up, the pedal over its edge per m/s short of
; the speed asked; 1 = the brake lights lit while the car is slowed or held, whichever pedal does it
hold_speed=0.1
reverse_gain=0.05
brake_lights=1
; virtual-key codes: engage/disengage (Insert), left and right indicators, cruise speed up and down (the arrow keys; the phone
; is blocked while the bridge is connected, as up takes it out)
key_engage=0x2D
key_left=0x25
key_right=0x27
key_speed_up=0x26
key_speed_down=0x28
; the map debug overlay on and off (Delete; gta5_cmd.py debug sets its layers)
key_debug=0x2E
; a bookmark where the car is now, for review (End; the bridge logs it to GTA5_MARKS and as openpilot's userBookmark)
key_mark=0x23
; a test press, counted for the map driver as testPresses (Ctrl+Insert); ctrl+ before the code asks for either Ctrl key to
; be held, and the press then doesn't count as the key alone (Home is not to be used: it freezes the game until Esc)
key_test=ctrl+0x2D
; 1 = the bridge's sounds as the car engages and hands back (openpilot's, in gta5op\sounds), 0 = none; their volume, 0-1
; of full scale, under the game's own volume in Windows' mixer
sounds=1
sound_volume=0.5
; 1 = our route on the minimap and map as a custom GPS route, from the start (gta5_cmd.py gpsroute on|off)
gps_route=0
; 1 = render the openpilot camera only on the 20 Hz frames it captures, so the player's camera shows on the rest (best with
; anti-aliasing that blends frames - TAA, DLSS, FSR - and motion blur off); lag is game frames from switching to rendering
interleave=0
interleave_lag=0
; >0 holds the game to this many frames a second; a multiple of 20 (80) puts openpilot frames the same game time apart, where
; 90 FPS alternates 4 and 5 frames (44 and 56 ms); gta5_cmd.py interleave tick_hz= sets it live
tick_hz=0
; when interleaving, 1 = take the frames from the game's D3D12 presents and show the player's previous frame in their
; place, so they don't show; 0 = capture the window, where they flicker
present_hook=1
; with the present hook, 1 = render each openpilot camera separately (a road view, then a wide view), at these vertical
; fields of view; 0 = one render at vfov for both. The game sometimes renders a frame with the previous frame's camera,
; so separate renders get mixed up now and then; the bridge drops pairs that don't match.
split_views=0
road_vfov=30
wide_vfov=116
